<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#32131f">

<title>A Beautiful Journey</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap');

:root {
    --wine: #591c36;
    --burgundy: #32131f;
    --gold: #f0d7a5;
    --ivory: #fff7eb;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow: hidden;
    background: #32131f;
    color: var(--ivory);
    font-family: 'Montserrat', sans-serif;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate;
    background: #553044;
}

/* ROMANTIC FLOWER GARDEN */

.garden {
    position: absolute;
    inset: -3%;

    background-image:
        linear-gradient(
            180deg,
            rgba(45, 15, 30, .12),
            rgba(58, 22, 40, .12) 40%,
            rgba(35, 13, 24, .48)
        ),
        url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=2000&q=85');

    background-size: cover;
    background-position: center 55%;

    transform: scale(1.02);
    transition: transform 9s cubic-bezier(.2,.65,.25,1),
                filter 3s ease;
    z-index: -3;
}

.scene::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(44, 15, 30, .25),
            transparent 45%,
            rgba(44, 15, 30, .18)
        ),
        linear-gradient(
            180deg,
            rgba(64, 25, 43, .06),
            transparent 40%,
            rgba(43, 15, 29, .48)
        );

    pointer-events: none;
    z-index: -2;
}

.scene.entered .garden {
    transform: scale(1.17);
    filter: saturate(1.12) brightness(1.06);
}

/* WARM GOLDEN ATMOSPHERE */

.glow {
    position: absolute;
    width: 65vw;
    height: 65vw;
    max-width: 650px;
    max-height: 650px;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);

    background: radial-gradient(
        circle,
        rgba(255, 218, 157, .22),
        rgba(255, 204, 133, .08) 40%,
        transparent 70%
    );

    pointer-events: none;
    z-index: -1;
}

/* SOFT FLOATING LIGHTS */

.fireflies {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.firefly {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff0ca;
    box-shadow: 0 0 12px 3px rgba(255, 220, 155, .45);
    animation: float 7s ease-in-out infinite alternate;
}

@keyframes float {
    from {
        transform: translate3d(0, 15px, 0);
        opacity: .25;
    }
    to {
        transform: translate3d(12px, -30px, 0);
        opacity: .9;
    }
}

/* PATHWAY */

.pathway {
    position: absolute;
    left: 50%;
    bottom: -12%;
    width: min(82vw, 570px);
    height: 63%;
    transform: translateX(-50%);
    pointer-events: none;
    opacity: .5;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 215, 160, .14) 45%,
            rgba(255, 231, 190, .22) 50%,
            rgba(255, 215, 160, .14) 55%,
            transparent
        );

    clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%);
    transition: opacity 3s ease;
}

.scene.entered .pathway {
    opacity: 1;
}

/* LANTERN POSITIONS */

.lanterns {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.lantern {
    position: absolute;
    width: 64px;
    height: 94px;

    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;

    pointer-events: auto;
    touch-action: manipulation;

    filter: drop-shadow(0 0 12px rgba(255, 213, 147, .25));

    animation: lanternFloat 4s ease-in-out infinite alternate;

    transition: filter .7s ease, transform .5s ease;
}

.lantern:nth-child(2) {
    animation-delay: -.8s;
}

.lantern:nth-child(3) {
    animation-delay: -1.6s;
}

.lantern:nth-child(4) {
    animation-delay: -2.4s;
}

@keyframes lanternFloat {
    from { margin-top: 0; }
    to { margin-top: -5px; }
}

.lantern.one {
    left: 12%;
    top: 39%;
    transform: scale(.76);
}

.lantern.two {
    right: 12%;
    top: 38%;
    transform: scale(.76);
}

.lantern.three {
    left: 23%;
    top: 60%;
    transform: scale(.95);
}

.lantern.four {
    right: 23%;
    top: 59%;
    transform: scale(.95);
}

/* LANTERN METAL FRAME */

.frame {
    position: absolute;
    left: 12px;
    top: 16px;
    width: 40px;
    height: 59px;

    border: 2px solid #b98a4c;
    border-radius: 5px 5px 8px 8px;

    background: linear-gradient(
        135deg,
        rgba(255, 238, 198, .17),
        rgba(109, 54, 33, .48),
        rgba(255, 224, 165, .12)
    );

    box-shadow:
        inset 0 0 0 2px rgba(255, 218, 156, .13),
        0 5px 12px rgba(40, 15, 22, .25);
}

.frame::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 8px;
    width: 20px;
    height: 7px;

    border: 2px solid #cba46b;
    border-radius: 4px 4px 0 0;
}

.frame::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 8px;
    width: 20px;
    height: 4px;
    border-radius: 50%;
    background: #cba46b;
}

/* GLASS GLOW */

.flame {
    position: absolute;
    left: 21px;
    top: 35px;

    width: 22px;
    height: 32px;
    border-radius: 50% 50% 42% 42%;

    background: radial-gradient(
        ellipse,
        #fff8d8 0%,
        #ffe0a0 30%,
        rgba(255, 177, 79, .65) 55%,
        rgba(255, 175, 90, .05) 100%
    );

    opacity: .65;
    transform: scale(.7);

    box-shadow: 0 0 18px 8px rgba(255, 196, 109, .23);

    transition: opacity 1s ease, transform 1s ease;
}

.lantern.active .flame {
    opacity: 1;
    transform: scale(1.12);

    box-shadow:
        0 0 20px 9px rgba(255, 216, 145, .65),
        0 0 55px 20px rgba(255, 190, 105, .28);
}

.lantern.active {
    filter: drop-shadow(0 0 24px rgba(255, 218, 151, .85));
}

.lantern:focus-visible {
    outline: 2px solid #fff0ca;
    outline-offset: 8px;
}

/* PATHWAY LIGHTS */

.path-lights {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
}

.path-light {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;

    background: #fff0c7;

    opacity: .25;

    box-shadow: 0 0 14px 5px rgba(255, 215, 151, .15);

    transition:
        opacity 1s ease,
        box-shadow 1s ease,
        transform 1s ease;
}

.path-light.on {
    opacity: 1;
    transform: scale(1.5);

    box-shadow:
        0 0 15px 5px rgba(255, 230, 180, .8),
        0 0 40px 12px rgba(255, 204, 130, .35);
}

/* OPENING TEXT */

.intro {
    position: absolute;
    inset: 0;
    z-index: 5;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 25px;

    pointer-events: none;
}

.eyebrow {
    color: #ffe6bd;
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 22px;

    opacity: 0;
    transform: translateY(10px);

    transition: opacity 2s ease, transform 2s ease;

    text-shadow: 0 1px 12px rgba(50, 15, 28, .8);
}

.eyebrow.visible {
    opacity: 1;
    transform: translateY(0);
}

.title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;

    font-size: clamp(39px, 8vw, 76px);
    line-height: 1.03;
    color: #fff0d0;

    text-shadow:
        0 2px 12px rgba(50, 15, 28, .6),
        0 0 40px rgba(255, 218, 158, .25);

    opacity: 0;
    transform: translateY(18px);

    transition: opacity 2s ease, transform 2s ease;
}

.title.visible {
    opacity: 1;
    transform: translateY(0);
}

.subtitle {
    margin-top: 20px;

    font-size: 10px;
    letter-spacing: 3px;
    color: #fff4e1;

    opacity: 0;
    transform: translateY(8px);

    transition: opacity 2s ease 1s, transform 2s ease 1s;
}

.subtitle.visible {
    opacity: 1;
    transform: translateY(0);
}

/* INITIAL PROMPT */

.prompt {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6%;

    z-index: 15;

    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;

    padding: 18px;

    pointer-events: none;

    transition: opacity 1s ease, transform 1s ease;
}

.prompt.hidden {
    opacity: 0;
    transform: translateY(15px);
    visibility: hidden;
}

.prompt-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(23px, 5vw, 31px);
    font-style: italic;
    color: #fff0d0;
    text-shadow: 0 2px 12px rgba(35, 10, 24, .9);
}

.hint {
    color: #fff6e7;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;

    text-shadow: 0 1px 8px #32131f;

    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: .65; }
    50% { opacity: 1; }
}

/* ENTER BUTTON */

.enter-btn {
    margin-top: 27px;
    padding: 16px 27px;

    border: 1px solid rgba(255, 224, 176, .85);
    color: #fff0d0;

    background: rgba(75, 25, 48, .75);

    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;

    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;

    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        background .4s ease,
        box-shadow .4s ease;
}

.enter-btn.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.enter-btn:active {
    transform: scale(.97);
}

.enter-btn:hover {
    background: rgba(116, 48, 72, .9);
    box-shadow: 0 0 28px rgba(255, 220, 166, .25);
}

/* GOLDEN LIGHT SWEEP */

.sweep {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -70%;
    width: 35%;

    z-index: 4;
    pointer-events: none;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 233, 190, .25),
        transparent
    );

    transform: skewX(-18deg);
    opacity: 0;
}

.sweep.run {
    animation: lightSweep 2.5s ease-in-out forwards;
}

@keyframes lightSweep {
    0% {
        left: -70%;
        opacity: 0;
    }
    25% {
        opacity: 1;
    }
    100% {
        left: 140%;
        opacity: 0;
    }
}

/* SMALL SCREENS */

@media (max-width: 600px) {
    .garden {
        background-position: center;
    }

    .lantern {
        transform-origin: center;
    }

    .lantern.one {
        left: 5%;
        top: 39%;
        transform: scale(.65);
    }

    .lantern.two {
        right: 5%;
        top: 39%;
        transform: scale(.65);
    }

    .lantern.three {
        left: 15%;
        top: 57%;
        transform: scale(.78);
    }

    .lantern.four {
        right: 15%;
        top: 57%;
        transform: scale(.78);
    }

    .prompt {
        bottom: 5%;
    }

    .eyebrow {
        letter-spacing: 3px;
        font-size: 9px;
    }

    .subtitle {
        letter-spacing: 2px;
    }

    .enter-btn {
        padding: 15px 22px;
        font-size: 8px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="scene" id="scene">

    <div class="garden"></div>
    <div class="glow"></div>
    <div class="pathway"></div>

    <div class="fireflies" id="fireflies"></div>
    <div class="path-lights" id="pathLights"></div>
    <div class="sweep" id="sweep"></div>

    <!-- FOUR INTERACTIVE GOLDEN LANTERNS -->

    <div class="lanterns">

        <button class="lantern one" aria-label="Light the first lantern">
            <span class="frame"></span>
            <span class="flame"></span>
        </button>

        <button class="lantern two" aria-label="Light the second lantern">
            <span class="frame"></span>
            <span class="flame"></span>
        </button>

        <button class="lantern three" aria-label="Light the third lantern">
            <span class="frame"></span>
            <span class="flame"></span>
        </button>

        <button class="lantern four" aria-label="Light the fourth lantern">
            <span class="frame"></span>
            <span class="flame"></span>
        </button>

    </div>

    <!-- TEXT REVEAL -->

    <section class="intro">
        <p class="eyebrow" id="eyebrow">
            A MOMENT TO REMEMBER
        </p>

        <h1 class="title" id="title">
            Every once<br>
            in a lifetime...
        </h1>

        <p class="subtitle" id="subtitle">
            A beautiful journey awaits
        </p>
    </section>

    <!-- STARTING PROMPT -->

    <section class="prompt" id="prompt">

        <p class="prompt-title">Touch the light...</p>

        <p class="hint">
            Touch any golden lantern to begin
        </p>

        <button class="enter-btn" id="enterBtn">
            Enter the garden &nbsp; →
        </button>

    </section>

</main>

<script>
(function () {
    'use strict';

    const scene = document.getElementById('scene');
    const lanterns = document.querySelectorAll('.lantern');
    const pathLights = document.getElementById('pathLights');
    const fireflies = document.getElementById('fireflies');

    const prompt = document.getElementById('prompt');
    const eyebrow = document.getElementById('eyebrow');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');

    const sweep = document.getElementById('sweep');
    const enterBtn = document.getElementById('enterBtn');

    let started = false;

    /* Floating golden lights */

    for (let i = 0; i < 24; i++) {
        const dot = document.createElement('span');

        dot.className = 'firefly';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = (20 + Math.random() * 70) + '%';
        dot.style.animationDelay = Math.random() * 5 + 's';
        dot.style.animationDuration = (5 + Math.random() * 5) + 's';

        fireflies.appendChild(dot);
    }

    /* Lights along the garden path */

    const positions = [
        [44, 47], [56, 47],
        [41, 55], [59, 55],
        [37, 63], [63, 63],
        [32, 72], [68, 72],
        [26, 82], [74, 82],
        [19, 92], [81, 92]
    ];

    positions.forEach(function (pos) {
        const light = document.createElement('span');

        light.className = 'path-light';
        light.style.left = pos[0] + '%';
        light.style.top = pos[1] + '%';

        pathLights.appendChild(light);
    });

    /* Reveal the opening text after the garden appears */

    window.setTimeout(function () {
        eyebrow.classList.add('visible');
    }, 700);

    /* Main interaction */

    function startGarden() {
        if (started) return;

        started = true;

        /* Light all lanterns */

        lanterns.forEach(function (lantern, index) {
            window.setTimeout(function () {
                lantern.classList.add('active');
            }, index * 350);
        });

        /* Start the cinematic forward movement */

        scene.classList.add('entered');

        /* Light the pathway one light at a time */

        document.querySelectorAll('.path-light').forEach(
            function (light, index) {
                window.setTimeout(function () {
                    light.classList.add('on');
                }, 200 + index * 180);
            }
        );

        /* Hide the touch prompt */

        prompt.classList.add('hidden');

        /* Golden sweep and romantic message */

        window.setTimeout(function () {
            sweep.classList.remove('run');

            /* Restart the sweep animation */

            void sweep.offsetWidth;

            sweep.classList.add('run');
        }, 1400);

        window.setTimeout(function () {
            title.classList.add('visible');
            subtitle.classList.add('visible');
        }, 2200);

        /* Reveal the enter button */

        window.setTimeout(function () {
            enterBtn.classList.add('visible');
        }, 4200);
    }

    /* Every lantern responds to touch or click */

    lanterns.forEach(function (lantern) {
        lantern.addEventListener('click', startGarden);
    });

    /* Continue button */

    enterBtn.addEventListener('click', function () {
        if (!started) return;

        /*
          The garden opening ends here.
          The next scene will be added separately.
        */

        enterBtn.textContent = 'The journey begins ♥';
        enterBtn.style.letterSpacing = '2px';
    });

})();
</script>

</body>
</html>
