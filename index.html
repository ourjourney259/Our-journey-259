
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Invitation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: #fff8e9;
      background: #21130f;
      text-align: center;
    }
    .invitation {
      min-height: 100vh;
      padding: 70px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, #70452f, transparent 65%),
        linear-gradient(145deg, #20120f, #4c2920, #17100d);
    }
    .eyebrow {
      letter-spacing: 5px;
      text-transform: uppercase;
      font-size: 12px;
      color: #e6c99b;
    }
    h1 {
      font-size: clamp(42px, 10vw, 76px);
      font-weight: normal;
      margin: 25px 0;
      color: #f4dfb7;
    }
    .divider {
      width: 90px;
      height: 1px;
      background: #d9b77d;
      margin: 10px auto 25px;
    }
    .message {
      max-width: 440px;
      line-height: 1.9;
      color: #f1dfcb;
    }
    .date {
      margin-top: 30px;
      color: #e6c99b;
      letter-spacing: 3px;
    }
    .note {
      margin-top: 60px;
      font: 12px Arial, sans-serif;
      color: #cbb8a3;
    }
  </style>
</head>
<body>
  <main class="invitation">
    <p class="eyebrow">Together with our families</p>
    <h1>Our Wedding</h1>
    <div class="divider"></div>
    <p class="message">
      Two hearts, one beautiful journey.<br>
      We invite you to celebrate the beginning
      of our forever.
    </p>
    <p class="date">OUR SPECIAL DAY</p>
    <p id="countdown">Our countdown begins soon</p>
    <p class="note">With love, we invite you to be part of our story.</p>
  </main>
</body>
</html>
