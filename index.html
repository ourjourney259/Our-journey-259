<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#391523">
<title>A Beautiful Journey</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: #391523;
    color: #fff1d6;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate;
    background: #513044;
}

/* ROMANTIC ROSE GARDEN */

.garden {
    position: absolute;
    inset: -4%;
    z-index: -3;

    background-image:
        linear-gradient(
            180deg,
            rgba(64, 22, 43, .08),
            rgba(60, 20, 39, .08) 35%,
            rgba(38, 13, 27, .35)
        ),
        url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=2000&q=85');

    background-position: center;
    background-size: cover;

    transform: scale(1.03);
    transition: transform 12s cubic-bezier(.2,.6,.2,1);
}

.scene.started .garden {
    transform: scale(1.18);
}

.scene::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            rgba(58, 21, 38, .08),
            transparent 30%,
            rgba(43, 15, 29, .48)
        );
}

/* WARM ROMANTIC GLOW */

.ambience {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 55%,
            rgba(255, 213, 151, .17),
            transparent 55%
        );
}

/* GARDEN STAIRCASE */

.stairs {
    position: absolute;
    width: min(92vw, 520px);
    height: 66%;
    left: 50%;
    bottom: -2%;
    transform: translateX(-50%);
    z-index: 2;
    pointer-events: none;

    perspective: 800px;
    transition: transform 10s ease;
}

.scene.started .stairs {
    transform: translateX(-50%) scale(1.06);
}

.step {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);

    width: var(--width);
    height: var(--height);

    bottom: var(--bottom);

    background:
        linear-gradient(
            180deg,
            rgba(115, 70, 70, .93),
            rgba(57, 31, 40, .97)
        );

    border-top: 2px solid rgba(255, 223, 171, .35);

    box-shadow:
        0 -3px 12px rgba(255, 209, 139, .06),
        0 8px 12px rgba(25, 8, 17, .22);

    clip-path: polygon(
        5% 0,
        95% 0,
        100% 100%,
        0 100%
    );
}

/* LIGHT STRIP ON EACH STEP */

.step::before {
    content: "";
    position: absolute;
    top: 0;
    left: 7%;
    width: 86%;
    height: 3px;

    background: #ffe9b7;
    opacity: .08;

    box-shadow: 0 0 0 transparent;

    transition:
        opacity 1s ease,
        box-shadow 1s ease;
}

.step.lit::before {
    opacity: 1;

    box-shadow:
        0 0 9px 2px rgba(255, 226, 174, .9),
        0 0 24px 5px rgba(255, 199, 119, .55);
}

.step.lit {
    border-top-color: rgba(255, 229, 182, .9);
}

/* TWO LIGHTS ON THE SIDES OF EVERY STEP */

.step-light {
    position: absolute;
    top: -2px;
    width: 6px;
    height: 6px;
    border-radius: 50%;

    background: #fff0c8;
    opacity: .1;

    transition:
        opacity .8s ease,
        box-shadow .8s ease;
}

.step-light.left {
    left: 8%;
}

.step-light.right {
    right: 8%;
}

.step.lit .step-light {
    opacity: 1;

    box-shadow:
        0 0 12px 4px rgba(255, 222, 162, .9),
        0 0 26px 8px rgba(255, 187, 108, .35);
}

/* INTERACTIVE LANTERN */

.lantern {
    position: absolute;
    z-index: 8;

    width: 58px;
    height: 76px;

    border: 2px solid #c6a06b;
    border-radius: 8px 8px 12px 12px;

    background: linear-gradient(
        135deg,
        rgba(255, 232, 186, .2),
        rgba(119, 66, 42, .6),
        rgba(255, 217, 153, .15)
    );

    box-shadow:
        inset 0 0 10px rgba(255, 222, 166, .12),
        0 0 16px rgba(255, 203, 125, .12);

    cursor: pointer;
    touch-action: manipulation;

    transition:
        background 1s ease,
        box-shadow 1s ease,
        filter 1s ease;
}

.lantern::before {
    content: "";
    position: absolute;
    left: 12px;
    top: -9px;

    width: 30px;
    height: 8px;

    border: 2px solid #d5b47b;
    border-radius: 5px 5px 0 0;
}

.lantern::after {
    content: "";
    position: absolute;
    left: 23px;
    top: 27px;

    width: 10px;
    height: 20px;

    border-radius: 50%;

    background: #fff4c8;
    opacity: .65;

    box-shadow: 0 0 15px 7px rgba(255, 206, 125, .28);

    transition: box-shadow 1s ease;
}

.lantern.active {
    background: rgba(255, 213, 145, .35);

    box-shadow:
        0 0 25px 8px rgba(255, 217, 156, .5),
        0 0 65px 20px rgba(255, 191, 104, .23);

    filter: brightness(1.3);
}

.lantern.active::after {
    opacity: 1;

    box-shadow:
        0 0 18px 10px rgba(255, 225, 166, .75),
        0 0 45px 18px rgba(255, 191, 104, .4);
}

.lantern-one {
    left: 9%;
    bottom: 24%;
}

.lantern-two {
    right: 9%;
    bottom: 24%;
}

/* OPENING TEXT */

.intro {
    position: absolute;
    inset: 0;
    z-index: 5;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 24px;
    text-align: center;

    pointer-events: none;
}

.eyebrow {
    font-size: 9px;
    letter-spacing: 4px;
    margin-bottom: 20px;

    color: #ffe5b6;

    opacity: 0;
    transform: translateY(10px);

    transition: opacity 2s ease, transform 2s ease;
}

.eyebrow.show {
    opacity: 1;
    transform: translateY(0);
}

.title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(38px, 8vw, 72px);
    line-height: 1.05;

    color: #fff0d0;

    text-shadow:
        0 2px 12px rgba(42, 12, 27, .65),
        0 0 35px rgba(255, 218, 160, .3);

    opacity: 0;
    transform: translateY(15px);

    transition: opacity 2s ease, transform 2s ease;
}

.title.show {
    opacity: 1;
    transform: translateY(0);
}

.subtitle {
    margin-top: 18px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #fff4e2;

    opacity: 0;
    transition: opacity 2s ease 1s;
}

.subtitle.show {
    opacity: 1;
}

/* TOUCH PROMPT */

.prompt {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4%;

    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;

    padding: 20px;
    text-align: center;

    pointer-events: none;

    transition: opacity 1s ease;
}

.prompt.hidden {
    opacity: 0;
    visibility: hidden;
}

.prompt p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 25px;
    color: #fff0d0;

    text-shadow: 0 2px 12px rgba(43, 13, 28, .8);
}

.hint {
    font-family: 'Montserrat', sans-serif;
    font-style: normal !important;

    font-size: 9px !important;
    letter-spacing: 2px;

    animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { opacity: .6; }
    50% { opacity: 1; }
}

/* ENTER BUTTON */

.enter {
    margin-top: 20px;
    padding: 15px 25px;

    border: 1px solid rgba(255, 225, 176, .8);
    background: rgba(75, 28, 48, .8);

    color: #fff0d0;

    font-size: 9px;
    letter-spacing: 3px;

    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;

    opacity: 0;
    visibility: hidden;

    transition: opacity 1.5s ease, background .4s ease;
}

.enter.show {
    opacity: 1;
    visibility: visible;
}

.enter:active {
    background: #71304c;
}

@media (max-width: 600px) {
    .stairs {
        width: 100vw;
        height: 62%;
    }

    .lantern-one {
        left: 5%;
        bottom: 24%;
        transform: scale(.8);
    }

    .lantern-two {
        right: 5%;
        bottom: 24%;
        transform: scale(.8);
    }

    .prompt {
        bottom: 4%;
    }

    .prompt p {
        font-size: 23px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="scene" id="scene">

    <div class="garden"></div>
    <div class="ambience"></div>

    <!-- Staircase is created by JavaScript -->

    <div class="stairs" id="stairs"></div>

    <!-- Interactive lanterns -->

    <button class="lantern lantern-one"
            id="lanternOne"
            aria-label="Touch to light the garden steps">
    </button>

    <button class="lantern lantern-two"
            id="lanternTwo"
            aria-label="Touch to light the garden steps">
    </button>

    <!-- Opening text -->

    <section class="intro">
        <p class="eyebrow" id="eyebrow">
            A MOMENT TO REMEMBER
        </p>

        <h1 class="title" id="title">
            Every once<br>
            in a lifetime...
        </h1>

        <p class="subtitle" id="subtitle">
            A beautiful journey awaits
        </p>
    </section>

    <!-- Starting prompt -->

    <section class="prompt" id="prompt">
        <p>Touch the lantern...</p>

        <p class="hint">
            Watch the garden steps come alive
        </p>

        <button class="enter" id="enter">
            Enter the garden →
        </button>
    </section>

</main>

<script>
(function () {
    const scene = document.getElementById('scene');
    const stairs = document.getElementById('stairs');

    const lanterns = [
        document.getElementById('lanternOne'),
        document.getElementById('lanternTwo')
    ];

    const prompt = document.getElementById('prompt');
    const eyebrow = document.getElementById('eyebrow');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const enter = document.getElementById('enter');

    let started = false;

    /*
      Create 10 perspective steps.
      The far steps are narrower and the near steps wider.
    */

    const totalSteps = 10;

    for (let i = 0; i < totalSteps; i++) {
        const step = document.createElement('div');
        step.className = 'step';

        const width = 28 + i * 7.1;
        const height = 5.2;
        const bottom = 11 + i * 5.65;

        step.style.setProperty('--width', width + '%');
        step.style.setProperty('--height', height + '%');
        step.style.setProperty('--bottom', bottom + '%');

        const leftLight = document.createElement('span');
        leftLight.className = 'step-light left';

        const rightLight = document.createElement('span');
        rightLight.className = 'step-light right';

        step.appendChild(leftLight);
        step.appendChild(rightLight);

        stairs.appendChild(step);
    }

    const steps = Array.from(
        document.querySelectorAll('.step')
    );

    /* Show the small opening line */

    window.setTimeout(function () {
        eyebrow.classList.add('show');
    }, 600);

    /*
      Touch either lantern:
      1. Lanterns glow.
      2. Stair lights switch on one by one.
      3. Camera moves forward.
      4. Opening message appears.
    */

    function begin() {
        if (started) return;

        started = true;

        lanterns.forEach(function (lantern, index) {
            window.setTimeout(function () {
                lantern.classList.add('active');
            }, index * 250);
        });

        scene.classList.add('started');
        prompt.classList.add('hidden');

        /*
          Light the staircase from the farthest step
          towards the guest, one step at a time.
        */

        const farToNear = steps.slice().reverse();

        farToNear.forEach(function (step, index) {
            window.setTimeout(function () {
                step.classList.add('lit');
            }, 350 + index * 480);
        });

        /* Reveal the message after the lights finish */

        const revealDelay = 350 + totalSteps * 480 + 500;

        window.setTimeout(function () {
            title.classList.add('show');
            subtitle.classList.add('show');
        }, revealDelay);

        window.setTimeout(function () {
            enter.classList.add('show');
        }, revealDelay + 1800);
    }

    lanterns.forEach(function (lantern) {
        lantern.addEventListener('click', begin);
    });

    /* Placeholder for the next wedding scene */

    enter.addEventListener('click', function () {
        enter.textContent = 'Your journey awaits ♥';
    });
})();
</script>

</body>
</html>
