<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Beautiful Journey</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400&display=swap');

:root {
    --wine: #4A1028;
    --burgundy: #2A101B;
    --gold: #E8D2A6;
    --ivory: #FFF5E8;
    --dark: #120B10;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--dark);
    color: var(--ivory);
}

body {
    font-family: 'Montserrat', sans-serif;
}

/* FULL-SCREEN GARDEN */

.garden {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            rgba(12, 7, 13, .40),
            rgba(25, 7, 17, .18) 45%,
            rgba(10, 5, 10, .90)
        ),
        url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2200&q=90')
        center center / cover no-repeat;

    transform: scale(1.04);
    transition: transform 12s cubic-bezier(.2,.6,.2,1);
}

.garden::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at 50% 50%,
            transparent 10%,
            rgba(18, 11, 16, .15) 45%,
            rgba(18, 11, 16, .85) 100%
        );
    pointer-events: none;
}

/* CINEMATIC COLOR GRADING */

.color-grade {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        180deg,
        rgba(42, 16, 27, .25),
        rgba(18, 11, 16, .12) 35%,
        rgba(18, 11, 16, .72)
    );
    pointer-events: none;
}

/* LIGHT MIST */

.mist {
    position: absolute;
    width: 150%;
    height: 35%;
    left: -25%;
    bottom: 8%;
    background: radial-gradient(
        ellipse,
        rgba(255, 235, 204, .12),
        rgba(255, 235, 204, .035) 40%,
        transparent 70%
    );
    filter: blur(30px);
    opacity: .45;
    animation: mistMove 18s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes mistMove {
    from {
        transform: translateX(-5%) translateY(0);
    }
    to {
        transform: translateX(5%) translateY(-12px);
    }
}

/* GOLDEN PARTICLES */

.particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px rgba(232, 210, 166, .8);
    opacity: 0;
    animation: floatParticle 8s linear infinite;
}

@keyframes floatParticle {
    0% {
        transform: translateY(25px);
        opacity: 0;
    }
    20% { opacity: .5; }
    80% { opacity: .3; }
    100% {
        transform: translateY(-150px);
        opacity: 0;
    }
}

/* PATHWAY LIGHTS */

.pathway-lights {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.path-light {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #FFE9BB;
    box-shadow:
        0 0 12px 4px rgba(232, 210, 166, .6),
        0 0 35px 12px rgba(232, 210, 166, .18);

    opacity: .15;
    transition:
        opacity 1.4s ease,
        box-shadow 1.4s ease;
}

.path-light.lit {
    opacity: 1;
    box-shadow:
        0 0 14px 5px rgba(255, 225, 165, .85),
        0 0 45px 18px rgba(232, 210, 166, .3);
}

/* LANTERNS */

.lantern {
    position: absolute;
    width: 42px;
    height: 58px;
    border: 1px solid rgba(232, 210, 166, .55);
    border-radius: 7px 7px 11px 11px;

    background: linear-gradient(
        180deg,
        rgba(255, 230, 183, .06),
        rgba(255, 194, 104, .30),
        rgba(255, 229, 183, .04)
    );

    box-shadow: 0 0 22px rgba(232, 210, 166, .08);
    cursor: pointer;
    z-index: 5;

    transition:
        box-shadow 1s ease,
        background 1s ease,
        transform .3s ease;
}

.lantern::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 7px;
    top: -6px;
    left: 10px;
    border: 1px solid rgba(232, 210, 166, .7);
    border-radius: 3px;
}

.lantern::after {
    content: "";
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #FFF0D0;
    left: 19px;
    top: 26px;
    box-shadow: 0 0 14px 8px rgba(255, 219, 153, .35);
}

.lantern.active {
    background: rgba(255, 215, 148, .4);
    box-shadow:
        0 0 30px 10px rgba(232, 210, 166, .35),
        0 0 80px 25px rgba(232, 210, 166, .15);
    transform: scale(1.08);
}

/* PLACE LANTERNS IN PERSPECTIVE */

.lantern.one {
    left: 17%;
    top: 49%;
    transform: scale(.65);
}

.lantern.two {
    left: 76%;
    top: 47%;
    transform: scale(.7);
}

.lantern.three {
    left: 29%;
    top: 64%;
    transform: scale(.9);
}

.lantern.four {
    left: 65%;
    top: 61%;
    transform: scale(.9);
}

/* INTRO OVERLAY */

.intro {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    z-index: 10;
    padding: 24px;

    background: rgba(18, 11, 16, .25);
    transition: opacity 1.5s ease;
}

.eyebrow {
    font-size: 9px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: .85;
    margin-bottom: 22px;
}

.title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(38px, 7vw, 76px);
    line-height: 1.1;
    letter-spacing: .5px;

    color: var(--gold);
    text-shadow: 0 0 35px rgba(232, 210, 166, .18);

    opacity: 0;
    transform: translateY(12px);
    transition:
        opacity 2s ease,
        transform 2s ease;
}

.title.visible {
    opacity: 1;
    transform: translateY(0);
}

.subtitle {
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255, 245, 232, .85);
    opacity: 0;
    transition: opacity 2s ease 1s;
}

.subtitle.visible {
    opacity: 1;
}

/* INTERACTION PROMPT */

.prompt {
    position: absolute;
    bottom: 12%;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 15px;

    z-index: 12;
    text-align: center;
    padding: 20px;

    transition: opacity 1s ease;
}

.prompt p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-style: italic;
    color: var(--gold);
    letter-spacing: 1px;
}

.touch-hint {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255, 245, 232, .8);
    text-transform: uppercase;
    animation: breathe 2.5s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
}

/* BUTTON */

.begin-btn {
    margin-top: 28px;
    padding: 15px 29px;

    color: var(--gold);
    background: rgba(18, 11, 16, .35);
    border: 1px solid rgba(232, 210, 166, .65);

    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;

    cursor: pointer;
    opacity: 0;
    pointer-events: none;

    transition:
        opacity 1.5s ease,
        background .4s ease,
        box-shadow .4s ease;
}

.begin-btn.visible {
    opacity: 1;
    pointer-events: auto;
}

.begin-btn:hover {
    background: rgba(232, 210, 166, .12);
    box-shadow: 0 0 30px rgba(232, 210, 166, .12);
}

/* LIGHT SWEEP */

.light-sweep {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -50%;
    width: 30%;
    transform: skewX(-18deg);

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 231, 183, .22),
        transparent
    );

    pointer-events: none;
    opacity: 0;
    z-index: 8;
}

.light-sweep.run {
    animation: sweep 2.2s ease-in-out forwards;
}

@keyframes sweep {
    0% {
        left: -50%;
        opacity: 0;
    }
    25% { opacity: 1; }
    100% {
        left: 130%;
        opacity: 0;
    }
}

/* STARTED STATE */

.garden.started {
    transform: scale(1.16);
}

.hidden {
    opacity: 0 !important;
    pointer-events: none !important;
}

/* RESPONSIVE */

@media (max-width: 600px) {
    .garden {
        background-position: center;
    }

    .lantern {
        width: 32px;
        height: 46px;
    }

    .lantern.one { left: 13%; }
    .lantern.two { left: 78%; }

    .prompt {
        bottom: 9%;
    }

    .eyebrow {
        letter-spacing: 3px;
    }

    .begin-btn {
        padding: 14px 22px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="garden" id="garden">

    <div class="color-grade"></div>
    <div class="mist"></div>
    <div class="particles" id="particles"></div>
    <div class="pathway-lights" id="pathwayLights"></div>
    <div class="light-sweep" id="lightSweep"></div>

    <!-- Interactive golden lanterns -->
    <button class="lantern one" aria-label="Touch the golden lantern"></button>
    <button class="lantern two" aria-label="Golden garden lantern"></button>
    <button class="lantern three" aria-label="Golden garden lantern"></button>
    <button class="lantern four" aria-label="Golden garden lantern"></button>

    <!-- First text reveal -->
    <section class="intro" id="intro">

        <p class="eyebrow">A MOMENT TO REMEMBER</p>

        <h1 class="title" id="title">
            Every once<br>
            in a lifetime…
        </h1>

        <p class="subtitle" id="subtitle">
            A beautiful journey awaits
        </p>

    </section>

    <!-- First interaction -->
    <section class="prompt" id="prompt">

        <p>Touch the light…</p>

        <span class="touch-hint">
            Touch the golden lantern to begin
        </span>

        <button class="begin-btn" id="beginBtn">
            Begin the journey&nbsp; →
        </button>

    </section>

</main>

<script>
const garden = document.getElementById('garden');
const lanterns = document.querySelectorAll('.lantern');
const particles = document.getElementById('particles');
const pathwayLights = document.getElementById('pathwayLights');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const prompt = document.getElementById('prompt');
const beginBtn = document.getElementById('beginBtn');
const lightSweep = document.getElementById('lightSweep');

let started = false;

/* Create subtle floating golden particles */

for (let i = 0; i < 24; i++) {
    const particle = document.createElement('span');
    particle.className = 'particle';

    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = (35 + Math.random() * 60) + '%';
    particle.style.animationDelay = (Math.random() * 8) + 's';
    particle.style.animationDuration = (6 + Math.random() * 6) + 's';

    particles.appendChild(particle);
}

/* Create lights along the pathway */

const lightPositions = [
    [43, 48], [57, 48],
    [39, 56], [61, 56],
    [34, 65], [66, 65],
    [28, 76], [72, 76],
    [22, 88], [78, 88]
];

lightPositions.forEach(([x, y]) => {
    const light = document.createElement('span');

    light.className = 'path-light';
    light.style.left = x + '%';
    light.style.top = y + '%';

    pathwayLights.appendChild(light);
});

/* First 2 seconds: show the garden before interaction */

window.addEventListener('load', () => {
    setTimeout(() => {
        document.querySelector('.eyebrow').style.opacity = '1';
    }, 500);
});

/* A simple cinematic chime using Web Audio */

function playChime() {
    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const now = ctx.currentTime;

        [659.25, 783.99].forEach((frequency, index) => {
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;

            const startTime = now + index * 0.16;

            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.exponentialRampToValueAtTime(
                0.045, startTime + 0.08
            );
            gain.gain.exponentialRampToValueAtTime(
                0.0001, startTime + 1.4
            );

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + 1.5);
        });

        setTimeout(() => ctx.close(), 2500);

    } catch (error) {
        console.log('Audio is unavailable on this device.');
    }
}

/* Touch the lantern */

lanterns.forEach((lantern) => {
    lantern.addEventListener('click', () => {
        if (started) return;
        started = true;

        lantern.classList.add('active');

        playChime();

        // Camera begins its smooth forward glide
        garden.classList.add('started');

        // Golden wave: pathway lights illuminate in sequence
        const lights = document.querySelectorAll('.path-light');

        lights.forEach((light, index) => {
            setTimeout(() => {
                light.classList.add('lit');
            }, 180 + index * 170);
        });

        // Other lanterns gradually light up
        lanterns.forEach((item, index) => {
            setTimeout(() => {
                item.classList.add('active');
            }, 500 + index * 350);
        });

        // Hide the initial touch prompt
        prompt.classList.add('hidden');

        // Reveal the first message
        setTimeout(() => {
            lightSweep.classList.add('run');
        }, 2200);

        setTimeout(() => {
            title.classList.add('visible');
            subtitle.classList.add('visible');
        }, 3000);

        // Reveal the next interaction button
        setTimeout(() => {
            beginBtn.classList.add('visible');
        }, 5000);
    });
});

/* Button is a placeholder for the next scene */

beginBtn.addEventListener('click', () => {
    alert(
        'The garden opening is complete! ' +
        'The next scene will be designed separately.'
    );
});
</script>

</body>
</html>
